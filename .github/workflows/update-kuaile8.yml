name: 每日更新快乐8开奖

on:
  schedule:
    - cron: '55 14 * * *'        # UTC 14:55 = 北京时间 22:55
  workflow_dispatch: {}          # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 抓取中彩网快乐8开奖
        run: python3 update_kuaile8.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kuaile8.json
          git diff --cached --quiet || git commit -m "auto: 更新快乐8开奖 $(date +%F)"
          git push

      - name: 刷新 jsDelivr 缓存
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}/kuaile8.json" || true
          curl -s "https://gcore.jsdelivr.net/gh/${{ github.repository }}/kuaile8.json" -o /dev/null || true
