name: 每日更新双色球开奖

on:
  schedule:
    - cron: '40 14 * * *'        # UTC 14:40 = 北京时间 22:40（开奖后自动更新）
  workflow_dispatch: {}          # 允许在 GitHub 网页手动点 Run 触发

permissions:
  contents: write                # 允许 Action 提交 ssq.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 抓取中彩网并合并开奖
        run: python3 update_ssq.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ssq.json
          git diff --cached --quiet || git commit -m "auto: 更新双色球开奖 $(date +%F)"
          git push

      - name: 刷新 jsDelivr CDN 缓存（gcore 节点国内友好）
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}/ssq.json" || true
          # 主动预热 gcore 边缘节点到最新版本，确保国内用户打开即最新
          curl -s "https://gcore.jsdelivr.net/gh/${{ github.repository }}/ssq.json" -o /dev/null || true
