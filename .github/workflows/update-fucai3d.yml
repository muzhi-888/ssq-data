name: update-fucai3d

on:
  schedule:
    - cron: "55 14 * * *"   # 北京时间 22:55 (UTC 14:55)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 抓取并合并开奖
        run: python update_fucai3d.py
      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fucai3d.json
          if git diff --cached --quiet; then echo "无变化，跳过提交"; else git commit -m "data: 自动更新福彩3D $(date +%F)"; git push; fi
      - name: 预热 gcore CDN 边缘
        run: curl -s "https://gcore.jsdelivr.net/gh/muzhi-888/ssq-data@main/fucai3d.json" || true
